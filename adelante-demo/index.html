<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adelante Portal Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* Layout idea: phone-first app shell. Welcome mode (Fraunces, terracotta, arches) for invitations, count mode (Inter, azulejo, square tiles) for every number. */
  --whitewash:#FBF7F0;--surface:#FFFFFF;--border:#EADFD0;--carob:#2A1E17;--muted:#5C4E44;
  --terracotta:#B4532A;--on-terracotta:#FFFFFF;--azulejo:#2E3A6B;--tint:#E9E4F0;--olive:#5E6B3A;
  --alert:#A3261E;--alert-bg:#FBECEA;--ok:#2F6B45;--ok-bg:#E8F2EA;
  --display:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--whitewash);color:var(--carob);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--azulejo);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:0 16px 150px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:190px}
.wm{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.wm small{display:block;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--azulejo);margin-top:4px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.demo{color:var(--olive)}
.lang{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--carob);background:transparent;font-weight:600;font-size:13px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:10px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15;margin:26px 0 10px;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0 0 4px}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:60ch}
.lbl{font-size:12px;font-weight:600;color:var(--olive);letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fig{font-size:30px;font-weight:700;line-height:1.05;color:var(--azulejo);font-variant-numeric:tabular-nums}
.fig.bad{color:var(--alert)}
.cap{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--azulejo)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sl label{font-size:14px}
.sl output{font-weight:700;color:var(--azulejo);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--terracotta);height:32px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--terracotta);background:var(--terracotta);color:var(--on-terracotta);font-weight:600}
.btn.ghost{background:transparent;color:var(--terracotta)}
.btn.quiet{border-color:var(--border);background:var(--surface);color:var(--carob)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.tool{border:1.5px dashed var(--alert);border-radius:2px;padding:10px;background:var(--surface)}
.tool b{display:block;font-size:14px}
.tool span{font-size:13px;color:var(--alert)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);white-space:nowrap;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--azulejo);border-color:var(--azulejo);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:2px;background:var(--tint);color:var(--azulejo)}
.tag.warn{background:var(--alert-bg);color:var(--alert)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.ol{background:#EEF0E4;color:var(--olive)}
.item{border-top:1px solid var(--border);padding:12px 0}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.quote{background:var(--whitewash);border-radius:2px;padding:8px 10px;margin:6px 0;font-size:14px}
.draft{border-left:3px solid var(--azulejo);padding:6px 10px;margin:6px 0;font-size:14px;background:var(--tint)}
textarea{width:100%;min-height:92px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--azulejo);border-radius:2px;background:#fff;color:var(--carob)}
.bar{height:10px;background:var(--tint);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--azulejo);border-radius:2px}
.bar.bad i{background:var(--alert)}
.alertc{border-color:var(--alert);background:var(--alert-bg)}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.ev:first-child{border-top:0}
.ev time{font-weight:700;color:var(--azulejo);font-variant-numeric:tabular-nums}
.ev.clash{background:var(--alert-bg);margin:0 -16px;padding:10px 16px}
.sw{width:52px;height:32px;border-radius:999px;border:1px solid var(--border);background:var(--tint);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--border);transition:left .15s}
.sw[aria-checked="true"]{background:var(--azulejo);border-color:var(--azulejo)}
.sw[aria-checked="true"]::after{left:23px}
#stage{position:relative;height:360px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--whitewash)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.nl{position:absolute;left:0;top:0;transform:translate(-999px,-999px);padding:3px 8px;border-radius:2px;border:1px solid var(--azulejo);background:var(--surface);color:var(--azulejo);font-size:12px;font-weight:600;white-space:nowrap;margin:-34px 0 0 0}
.nl.off{border-color:var(--alert);color:var(--alert);border-style:dashed}
.nl.dim{opacity:.3}
.nl.sel{background:var(--azulejo);color:#fff;border-style:solid;border-color:var(--azulejo)}
.seg{display:inline-flex;border:1px solid var(--carob);border-radius:999px;overflow:hidden}
.seg button{min-height:40px;padding:0 16px;border:0;background:transparent;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--carob);color:var(--whitewash)}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ba>div{border-radius:2px;padding:12px;background:var(--surface);border:1px solid var(--border)}
.ba>div.after{border-color:var(--azulejo)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{min-height:58px;border:0;background:transparent;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
nav button b{font-size:13px;width:22px;height:22px;border-radius:2px;background:var(--tint);color:var(--azulejo);display:grid;place-items:center}
nav button[aria-current="page"]{color:var(--carob)}
nav button[aria-current="page"] b{background:var(--azulejo);color:#fff}
#tour{position:fixed;left:0;right:0;bottom:calc(59px + env(safe-area-inset-bottom));z-index:6;padding:0 12px 8px;pointer-events:none}
#tour>div{max-width:736px;margin:0 auto;background:var(--carob);color:var(--whitewash);border-radius:16px;padding:12px 14px;pointer-events:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#tour p{margin:0;flex:1;min-width:200px;font-size:14px}
#tour button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--whitewash);background:transparent;color:var(--whitewash);font-weight:600;font-size:14px}
#tour button.go{background:var(--whitewash);color:var(--carob)}
section[hidden]{display:none}
details summary{cursor:pointer;font-weight:600;color:var(--terracotta);min-height:40px;display:flex;align-items:center}
code{font-size:13px;background:var(--whitewash);padding:1px 5px;border-radius:2px}
a{color:var(--terracotta)}
@media (min-width:620px){h1{font-size:40px}.tools{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function chrome(){
document.documentElement.lang=S.lang;
document.getElementById('demoPill').textContent=t('demo');
document.getElementById('langBtn').textContent=t('langBtn');
var n=t('nav');
document.getElementById('navIn').innerHTML=VIEWS.map(function(v,i){return '<button data-a="nav" data-v="'+v+'"'+(S.view===v?' aria-current="page"':'')+'><b>'+(i+1)+'</b>'+n[i]+'</button>'}).join('');
VIEWS.forEach(function(v){document.getElementById('v-'+v).hidden=S.view!==v});
var tr=document.getElementById('tour');
tr.innerHTML=S.tour?'<div><p>'+t('tour')[S.tour-1]+'</p><button data-a="tskip">'+t('skip')+'</button><button class="go" data-a="tnext">'+t(S.tour<4?'next':'finish')+'</button></div>':'';
}
function all(){rToday();rPortal();rConn();rOut();chrome();upd();}
function go(v,noHash){if(VIEWS.indexOf(v)<0)v='today';S.view=v;chrome();if(v==='connections')G.init();if(!noHash){try{if(location.hash!=='#'+v)location.hash=v}catch(e){}}window.scrollTo(0,0);}

document.addEventListener('click',function(e){
var b=e.target.closest('[data-a]');if(!b)return;
var a=b.getAttribute('data-a'),v=b.getAttribute('data-v'),i=+b.getAttribute('data-i');
function m(){return msgs.filter(function(x){return x.id===i})[0]}
if(a==='nav'){go(v);return}
if(a==='lang'){S.lang=S.lang==='en'?'es':'en';all();return}
if(a==='tab'){S.tab=v;if(S.view!=='portal')go('portal');rPortal();return}
if(a==='mok'){m().st='a';m().ed=false}
if(a==='mno'){m().st='r';m().ed=false}
if(a==='mundo'){m().st='p'}
if(a==='medit'){m().ed=true}
if(a==='msave'){var ta=document.getElementById('ta-'+i);m().cu=ta.value;m().ed=false}
if(a==='fix'){S.clash=true}
if(a==='lead'){leads[i].done=!leads[i].done}
if(a==='auto'){autos[i].on=!autos[i].on}
if(a==='exc'){excs[i].done=true}
if(a==='inv'){invs[i].done=true}
if(a==='conn'){S.connected=v==='1';rConn();return}
if(a==='mod'){S.mod=S.mod===v?null:v;rConn();return}
if(a==='node'){S.node=S.node===v?null:v;rConn();return}
if(a==='tskip'){S.tour=0;chrome();return}
if(a==='tnext'){if(S.tour>=4){S.tour=0;chrome()}else{S.tour++;go(VIEWS[S.tour-1])}return}
rPortal();
});
document.addEventListener('input',function(e){
var k=e.target.getAttribute&&e.target.getAttribute('data-s');if(!k)return;
S[k]=+e.target.value;document.getElementById('o-'+k).textContent=S[k]+SUF[k];upd();
});
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(v&&v!==S.view)go(v,true)});

var G={ok:null,init:function(){
if(G.ok!==null)return;
var stage=document.getElementById('stage'),cv=document.getElementById('cv');
try{if(!window.THREE)throw 0;G.r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false});}catch(err){G.ok=false;stage.style.display='none';rConn();return}
G.ok=true;
var r=G.r,sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,0.1,200);
sc.background=new THREE.Color(0xFBF7F0);
r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
sc.add(new THREE.AmbientLight(0xffffff,0.85));var dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(8,14,10);sc.add(dl);
var floor=new THREE.Mesh(new THREE.CircleGeometry(11,64),new THREE.MeshBasicMaterial({color:0xF3ECDF}));floor.rotation.x=-Math.PI/2;floor.position.y=-0.01;sc.add(floor);
var terra=new THREE.MeshPhongMaterial({color:0xB4532A,shininess:8});
[-1.4,1.4].forEach(function(x){var p=new THREE.Mesh(new THREE.BoxGeometry(0.8,2.6,0.8),terra);p.position.set(x,1.3,0);sc.add(p)});
var top=new THREE.Mesh(new THREE.TorusGeometry(1.4,0.4,14,32,Math.PI),terra);top.position.y=2.6;top.scale.z=1;sc.add(top);
var tiles={},tk=['reply','follow','content','back'],tp=[[-0.4,1.75],[0.4,1.75],[-0.4,0.95],[0.4,0.95]];
tk.forEach(function(k,i){var m=new THREE.Mesh(new THREE.BoxGeometry(0.66,0.66,0.22),new THREE.MeshPhongMaterial({color:0xE9E4F0}));m.position.set(tp[i][0],tp[i][1],0);sc.add(m);tiles[k]=m});
var hub=new THREE.Vector3(0,1.4,0),items=[],pick=[];
NODES.forEach(function(n,i){
var a=i/NODES.length*Math.PI*2,pos=new THREE.Vector3(Math.cos(a)*7.2,1.2+Math.sin(i*1.9)*1.1+1,Math.sin(a)*7.2);
var mat=new THREE.MeshPhongMaterial({color:0x9A8F86,transparent:true});
var mesh=new THREE.Mesh(new THREE.SphereGeometry(0.6,28,18),mat);mesh.position.copy(pos);mesh.userData.id=n.id;sc.add(mesh);pick.push(mesh);
var stem=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,pos.y,8),new THREE.MeshBasicMaterial({color:0xEADFD0}));stem.position.set(pos.x,pos.y/2,pos.z);sc.add(stem);
var full=new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos,hub]),new THREE.LineBasicMaterial({color:0x2E3A6B,transparent:true}));sc.add(full);
var mid=pos.clone().lerp(hub,0.3),stub=new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos,mid]),new THREE.LineBasicMaterial({color:0xA3261E,transparent:true,opacity:0.7}));sc.add(stub);
var cap=new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8),new THREE.MeshBasicMaterial({color:0xA3261E}));cap.position.copy(mid);sc.add(cap);
var pulse=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10),new THREE.MeshBasicMaterial({color:0x2E3A6B}));sc.add(pulse);
var lab=document.createElement('button');lab.className='nl';lab.setAttribute('data-a','node');lab.setAttribute('data-v',n.id);stage.appendChild(lab);
items.push({n:n,pos:pos,mesh:mesh,mat:mat,full:full,stub:stub,cap:cap,pulse:pulse,lab:lab,off:i*0.37});
});
var ang=0.7,el=0.42,R=19,W=0,H=0,ptr={},drag=false,moved=0,lastD=0,idle=999;
var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
G.sync=function(){
var act=S.mod?MODS[S.mod]:null;
items.forEach(function(it){
var dim=act&&act.indexOf(it.n.id)<0,sel=S.node===it.n.id;
it.mat.color.set(S.connected?0x2E3A6B:0x9A8F86);it.mat.opacity=dim?0.25:1;
it.mesh.scale.setScalar(sel?1.35:1);
it.full.visible=S.connected;it.full.material.opacity=dim?0.12:0.8;
it.stub.visible=it.cap.visible=!S.connected;it.pulse.visible=S.connected&&!dim;
it.lab.textContent=L(it.n.n);it.lab.className='nl'+(S.connected?'':' off')+(dim?' dim':'')+(sel?' sel':'');
});
tk.forEach(function(k){tiles[k].material.color.set(S.connected?0x2E3A6B:0xE9E4F0);tiles[k].scale.setScalar(S.mod===k?1.3:1)});
};
G.sync();
cv.addEventListener('pointerdown',function(e){ptr[e.pointerId]={x:e.clientX,y:e.clientY};drag=true;moved=0;lastD=0;try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',function(e){
var p=ptr[e.pointerId];if(!p)return;var ids=Object.keys(ptr);
if(ids.length>=2){p.x=e.clientX;p.y=e.clientY;var a=ptr[ids[0]],b=ptr[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD)R=Math.min(30,Math.max(10,R*lastD/d));lastD=d;moved=99;return}
var dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);ang-=dx*0.008;el=Math.min(1.2,Math.max(0.12,el+dy*0.005));p.x=e.clientX;p.y=e.clientY;idle=0;
});
function up(e){
if(ptr[e.pointerId]&&moved<8&&Object.keys(ptr).length===1){
var rc=cv.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(v,cam);
var hit=ray.intersectObjects(pick)[0];if(hit){var id=hit.object.userData.id;S.node=S.node===id?null:id;rConn()}
}
delete ptr[e.pointerId];lastD=0;if(!Object.keys(ptr).length)drag=false;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();R=Math.min(30,Math.max(10,R+e.deltaY*0.02))},{passive:false});
var v3=new THREE.Vector3(),t0=performance.now();
(function loop(now){
requestAnimationFrame(loop);
if(S.view!=='connections')return;
var w=stage.clientWidth,h=stage.clientHeight;if(!w)return;
if(w!==W||h!==H){W=w;H=h;r.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix()}
idle++;if(!drag&&idle>90&&!still)ang+=0.0025;
cam.position.set(Math.sin(ang)*Math.cos(el)*R,Math.sin(el)*R+1.5,Math.cos(ang)*Math.cos(el)*R);cam.lookAt(0,1.8,0);
var tt=((now||0)-t0)/1000;
items.forEach(function(it){
if(it.pulse.visible){var f=(tt*0.35+it.off)%1;it.pulse.position.copy(it.pos).lerp(hub,still?0.5:f)}
v3.copy(it.pos).project(cam);
it.lab.style.transform=v3.z>1?'translate(-999px,-999px)':'translate('+Math.round((v3.x*.5+.5)*W)+'px,'+Math.round((-v3.y*.5+.5)*H)+'px) translateX(-50%)';
});
r.render(sc,cam);
})();
}};

var hv=location.hash.slice(1);if(VIEWS.indexOf(hv)>=0){S.view=hv;S.tour=0}
all();if(S.view==='connections')G.init();
})();
</script>
