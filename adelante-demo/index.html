<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adelante Portal Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* Layout idea: a control room. Carob sidebar and carob 3D stage frame a whitewash workspace; terracotta invites action, azulejo carries every number. Sidebar on laptop, bottom bar on phone. */
  --whitewash:#FBF7F0;--surface:#FFFFFF;--border:#EADFD0;--carob:#2A1E17;--carob-2:#34271F;--carob-3:#4A3B30;--muted:#5C4E44;--on-carob:#FBF7F0;--on-carob-muted:#CBBFB2;
  --terracotta:#B4532A;--terracotta-l:#E08A63;--azulejo:#2E3A6B;--azulejo-l:#A9B6E8;--tint:#E9E4F0;--olive:#5E6B3A;
  --alert:#A3261E;--alert-bg:#FBECEA;--ok:#2F6B45;--ok-bg:#E8F2EA;--warm-bg:#FAEEE7;
  --shadow:0 1px 2px rgba(42,30,23,.05),0 10px 28px rgba(42,30,23,.07);
  --display:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--whitewash);color:var(--carob);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--azulejo);outline-offset:2px}
svg.ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.shell{min-height:100vh}
aside{display:none}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:var(--whitewash);z-index:4;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.wm{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.wm small{display:block;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--azulejo);margin-top:3px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--olive);white-space:nowrap}
.lang{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--carob);background:transparent;font-weight:600;font-size:13px}
main{padding:18px 16px 110px;max-width:1220px;margin:0 auto}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:0 0 6px;text-wrap:balance}
h2{font-size:16px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:62ch}
.lbl{font-size:11px;font-weight:700;color:var(--olive);letter-spacing:.07em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;display:block;width:100%}
.kpi.hot{border-color:var(--terracotta);background:var(--warm-bg)}
.fig{font-size:28px;font-weight:700;line-height:1.1;color:var(--azulejo);font-variant-numeric:tabular-nums}
.kpi.hot .fig{color:var(--terracotta)}
.fig.bad{color:var(--alert)}
.cap{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--azulejo)}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--terracotta);background:var(--terracotta);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--terracotta)}
.btn.quiet{border-color:var(--border);background:var(--surface);color:var(--carob)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:2px;background:var(--tint);color:var(--azulejo)}
.tag.warn{background:var(--alert-bg);color:var(--alert)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.ol{background:#EEF0E4;color:var(--olive)}
.tag.hot{background:var(--warm-bg);color:var(--terracotta)}
.item{border-top:1px solid var(--border);padding:12px 0}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.need{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.need .dot{width:36px;height:36px;border-radius:2px;background:var(--warm-bg);color:var(--terracotta);display:grid;place-items:center}
.quote{background:var(--whitewash);border-radius:2px;padding:8px 10px;margin:6px 0;font-size:14px}
.draft{border-left:3px solid var(--azulejo);padding:6px 10px;margin:6px 0;font-size:14px;background:var(--tint)}
textarea{width:100%;min-height:92px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--azulejo);border-radius:2px;background:#fff;color:var(--carob)}
.bar{height:10px;background:var(--tint);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--azulejo);border-radius:2px}
.alertc{border-color:var(--alert);background:var(--alert-bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);white-space:nowrap;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--azulejo);border-color:var(--azulejo);color:#fff}
.chip .n{font-size:11px;min-width:18px;height:18px;border-radius:9px;background:var(--terracotta);color:#fff;display:inline-grid;place-items:center;padding:0 5px}
.pa{background:var(--carob);color:var(--on-carob);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.pa h2{color:var(--on-carob)}
.pa .chip{background:transparent;border-color:var(--carob-3);color:var(--on-carob);font-weight:500}
.pa .chip[aria-pressed="true"]{background:var(--on-carob);color:var(--carob);border-color:var(--on-carob)}
.pa .ans{font-family:var(--display);font-size:17px;line-height:1.4;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--carob-3)}
.feed{display:grid;grid-template-columns:48px 1fr;gap:4px 10px;font-size:14px}
.feed time{color:var(--azulejo);font-weight:600;font-variant-numeric:tabular-nums}
.stagecard{background:var(--carob);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);color:var(--on-carob)}
.stagehead{padding:14px 16px 10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stagehead h2{margin:0;color:var(--on-carob)}
.stagehead .cap{color:var(--on-carob-muted);flex-basis:100%;margin:0}
.seg{display:inline-flex;border:1px solid var(--carob-3);border-radius:999px;overflow:hidden}
.seg button{min-height:36px;padding:0 14px;border:0;background:transparent;font-weight:600;font-size:13px;color:var(--on-carob-muted)}
.seg button[aria-pressed="true"]{background:var(--on-carob);color:var(--carob)}
#stage{position:relative;height:360px;overflow:hidden;background:var(--carob)}
#stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.nl{position:absolute;left:0;top:0;transform:translate(-999px,-999px);padding:2px 7px;border-radius:2px;border:0;background:rgba(42,30,23,.82);color:var(--on-carob);font-size:11px;font-weight:600;white-space:nowrap;display:flex;gap:5px;align-items:center}
.nl .n{min-width:16px;height:16px;border-radius:8px;background:var(--terracotta-l);color:var(--carob);font-size:10px;display:inline-grid;place-items:center;padding:0 4px}
.nl.off{color:#F0A9A2}
.nl.dim{opacity:.3}
.nl.sel{background:var(--on-carob);color:var(--carob)}
.sys{padding:14px 16px 16px;border-top:1px solid var(--carob-3)}
.sys .tag{background:var(--carob-3);color:var(--azulejo-l)}
.sys .tag.warn{background:#5A2A25;color:#F0A9A2}
.sys .tag.hot{background:#5A3626;color:var(--terracotta-l)}
.sys .tag.ok{background:#2F4A39;color:#B9DDC5}
.sys .lbl{color:var(--on-carob-muted)}
.sys p{color:var(--on-carob)}
.sys .chip{background:transparent;border-color:var(--carob-3);color:var(--on-carob);min-height:36px;font-size:13px;font-weight:500}
.sys .chip[aria-pressed="true"]{background:var(--azulejo-l);border-color:var(--azulejo-l);color:var(--carob)}
.sys .btn{background:var(--terracotta-l);border-color:var(--terracotta-l);color:var(--carob)}
.hgrid{display:flex;flex-direction:column;gap:14px}
.hgrid .col{display:contents}
#h-needs{order:1}.stagecard{order:2}#h-pa{order:3}#h-feed{order:4}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.ev:first-child{border-top:0}
.ev time{font-weight:700;color:var(--azulejo);font-variant-numeric:tabular-nums}
.ev.clash{background:var(--alert-bg);margin:0 -16px;padding:10px 16px}
.sw{width:52px;height:32px;border-radius:999px;border:1px solid var(--border);background:var(--tint);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--border);transition:left .15s}
.sw[aria-checked="true"]{background:var(--azulejo);border-color:var(--azulejo)}
.sw[aria-checked="true"]::after{left:23px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sl label{font-size:14px}
.sl output{font-weight:700;color:var(--azulejo);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--terracotta);height:32px}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ba>div{border-radius:2px;padding:12px;background:var(--whitewash);border:1px solid var(--border)}
.ba>div.after{border-color:var(--azulejo);background:var(--surface)}
.two{display:grid;gap:14px}
details summary{cursor:pointer;font-weight:600;color:var(--terracotta);min-height:40px;display:flex;align-items:center}
#bnav{position:fixed;left:0;right:0;bottom:0;background:var(--carob);padding-bottom:env(safe-area-inset-bottom);z-index:6;display:grid;grid-template-columns:repeat(5,1fr)}
#bnav button{min-height:60px;border:0;background:transparent;font-size:11px;font-weight:600;color:var(--on-carob-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
#bnav button[aria-current="page"]{color:var(--terracotta-l)}
#bnav .n,.snav .n{font-size:10px;min-width:16px;height:16px;border-radius:8px;background:var(--terracotta-l);color:var(--carob);display:inline-grid;place-items:center;padding:0 4px}
#bnav .n{position:absolute;top:8px;left:calc(50% + 6px)}
#sheet{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));background:var(--carob-2);z-index:5;padding:10px 12px;display:grid;gap:6px;border-radius:16px 16px 0 0}
#sheet[hidden]{display:none}
#sheet button{min-height:48px;border:0;border-radius:8px;background:transparent;color:var(--on-carob);font-weight:600;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left}
section[hidden]{display:none}
a{color:var(--terracotta)}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:34px}#stage{height:420px}}
@media (min-width:980px){
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr)}
  aside{display:flex;flex-direction:column;gap:6px;background:var(--carob);color:var(--on-carob);padding:20px 14px;position:sticky;top:0;height:100vh}
  aside .brand{flex:none}aside .wm{color:var(--on-carob)}aside .wm small{color:var(--azulejo-l)}
  .snav{display:flex;flex-direction:column;gap:2px;margin-top:22px;flex:1}
  .snav button{min-height:42px;border:0;border-radius:8px;background:transparent;color:var(--on-carob-muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left}
  .snav button span.t{flex:1}
  .snav button:hover{background:var(--carob-2)}
  .snav button[aria-current="page"]{background:var(--carob-3);color:var(--on-carob)}
  aside .pill{background:transparent;border-color:var(--carob-3);color:var(--on-carob-muted);align-self:flex-start}
  aside .lang{border-color:var(--carob-3);color:var(--on-carob);align-self:flex-start;margin-top:8px}
  .top,#bnav,#sheet{display:none!important}
  main{padding:28px 32px 60px}
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
  .hgrid .col{display:flex;flex-direction:column;gap:14px}
  #stage{height:440px}
  .two{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
