:root{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;

.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;color:var(--terracotta)}
.brand svg{width:30px;height:36px;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);font:600 13px var(--body);padding:6px 14px;cursor:pointer;letter-spacing:.04em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 14px 14px;padding:28px max(20px,4vw) 24px}

.tiles span.done{background:var(--olive)} .tiles span.now{background:var(--terracotta)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--azulejo)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(28px,6vw,38px);margin:6px 0 8px} h2{font-size:clamp(23px,5vw,29px);margin:6px 0 8px} h3{font-size:20px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 4px;max-width:60ch}
.qs{display:flex;flex-direction:column;gap:22px;margin-top:22px}
.q label.ql,.q legend{display:block;font-weight:600;margin-bottom:4px;padding:0}
.q .hint{display:block;font-size:14px;color:var(--muted);margin-bottom:8px;font-weight:400}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
input[type=text],input[type=email],input[type=tel],input[type=number],textarea,select{width:100%;font:16px var(--body);color:var(--ink);background:var(--bg);

textarea{min-height:84px;resize:vertical}
.euro{position:relative}.euro input{padding-left:30px}.euro::before{content:"€";position:absolute;left:12px;top:11px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;background:var(--bg);user-select:none}
.chip input:checked+span{background:var(--azulejo);border-color:var(--azulejo);color:var(--surface)}

.more{margin-top:8px}
.more summary{font-size:14px;color:var(--azulejo);cursor:pointer;font-weight:600}
.more textarea{margin-top:8px;min-height:70px}
.req{color:var(--terracotta)}
.err{color:var(--error);font-size:14px;margin-top:6px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.consent input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--azulejo)}
.privacy{font-size:13px;color:var(--muted);margin-top:8px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{font:600 16px var(--body);border-radius:999px;padding:12px 24px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;display:inline-block}
.btn.primary{background:var(--terracotta);border-color:var(--terracotta);color:var(--terracotta-ink)}
.btn.wa{background:var(--olive);border-color:var(--olive);color:var(--surface)}

.promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}
.promise div{border-top:3px solid var(--olive);padding-top:10px;font-size:15px;color:var(--muted)}
.promise b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.note{font-size:13px;color:var(--muted)}
.result{margin-top:20px;padding:20px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.big{font-family:var(--display);font-size:clamp(30px,8vw,44px);color:var(--terracotta);line-height:1.1;font-variant-numeric:tabular-nums}
.breakdown{display:grid;gap:8px;margin-top:14px;font-size:15px}
.breakdown div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.breakdown span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mods{display:grid;gap:12px;margin-top:14px}
.mod{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.mod i{width:28px;height:28px;border-radius:4px;background:var(--azulejo);display:block}
.mod:nth-child(2) i{background:var(--olive)} .mod:nth-child(3) i{background:var(--terracotta)}
.mod b{display:block}.mod p{margin:2px 0 0;color:var(--muted);font-size:15px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.split label{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px;background:var(--bg);font-size:15px}
.split input{width:64px;flex:none;text-align:right;padding:6px 8px;font-variant-numeric:tabular-nums}
.split-total{margin-top:8px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.split-total.off{color:var(--terracotta)}
.fallback{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.fallback textarea{min-height:160px;font-size:13px}
footer{text-align:center;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

    const o=v||{};
    return `<fieldset><legend>${label}${hint}</legend><div class="split">${q.opts.map(x=>
      `<label for="${id}_${x[0]}"><span>${esc(lang==="en"?x[1]:x[2])}</span><input id="${id}_${x[0]}" data-split="${q.id}" type="number" inputmode="numeric" min="0" max="100" step="5" value="${esc(o[x[0]]||"")}" placeholder="%"></label>`).join("")}</div><div class="split-total" id="${id}_total"></div></fieldset>`;
  }
  if(q.type==="textarea")
    return `<label class="ql" for="${id}">${label}${hint}</label><textarea id="${id}">${esc(v||"")}</textarea>`;
  if(q.type==="radio"||q.type==="checks"){
    const multi = q.type==="checks", arr = multi?(v||[]):[v];
    const maxH = q.max?`<span class="hint">${t("max")} ${q.max}</span>`:"";
    return `<fieldset><legend>${label}${hint}${maxH}</legend><div class="chips">${q.opts.map(o=>
      `<label class="chip"><input type="${multi?'checkbox':'radio'}" name="${id}" id="${id}_${o[0]}" value="${o[0]}" ${arr.includes(o[0])?"checked":""}><span>${esc(lang==="en"?o[1]:o[2])}</span></label>`).join("")}</div></fieldset>${more}`;
  }
  if(q.type==="consent")
    return `<label class="consent"><input type="checkbox" id="${id}" ${v?"checked":""}><span>${esc(L(q))}</span></label>
    <p class="privacy">${esc(t("privacy").replace("{ctl}",CONTROLLER).replace("{em}",CONTACT_EMAIL))}</p>
    <div class="hp" aria-hidden="true"><label for="f_honey">Leave empty</label><input id="f_honey" type="text" tabindex="-1" autocomplete="off"></div>`;
}

function collect(){
  SECTIONS[step].qs.forEach(q=>{
    if(!visible(q)) return;
    const id="f_"+q.id;
    if(q.type==="checks") A[q.id]=[...document.querySelectorAll(`input[name="${id}"]:checked`)].map(i=>i.value);
    else if(q.type==="radio"){ const c=document.querySelector(`input[name="${id}"]:checked`); A[q.id]=c?c.value:""; }
    else if(q.type==="consent") A[q.id]=document.getElementById(id).checked;
    else if(q.type==="split"){ const o={}; q.opts.forEach(x=>{ const el=document.getElementById(id+"_"+x[0]); if(el&&el.value!=="") o[x[0]]=el.value; }); A[q.id]=o; }
    else { const el=document.getElementById(id); if(el) A[q.id]=el.value.trim(); }
    const m=document.getElementById(id+"_more"); if(m) A[q.id+"_more"]=m.value.trim();
  });
  const hp=document.getElementById("f_honey"); if(hp) A._honey=hp.value;
  save();
}

function validate(){
  let ok=true, first=null;
  card.querySelectorAll(".err").forEach(e=>e.remove());
  SECTIONS[step].qs.forEach(q=>{
    if(!visible(q)) return;
    const v=A[q.id]; let msg="";
    if(q.req && (v===undefined||v===""||v===false||(Array.isArray(v)&&!v.length))) msg = q.type==="consent"?t("consentReq"):q.type==="tel"?t("phoneBad"):t("required");
    else if(q.type==="email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) msg=t("emailBad");
    else if(q.type==="tel" && v && v.replace(/\D/g,"").length<9) msg=t("phoneBad");
    if(msg){ ok=false; const w=document.getElementById("q_"+q.id); w.insertAdjacentHTML("beforeend",`<div class="err" role="alert">${msg}</div>`); first=first||w; }
  });
  if(first){ first.scrollIntoView({behavior:"smooth",block:"center"}); first.querySelector("input,textarea")?.focus({preventScroll:true}); }
  return ok;
}

function applyMax(form,q){ const boxes=[...form.querySelectorAll(`input[name="f_${q.id}"]`)]; const n=boxes.filter(b=>b.checked).length; boxes.forEach(b=>b.disabled=!b.checked&&n>=q.max); }

function renderStep(){
  const s=SECTIONS[step], last=step===SECTIONS.length-1;
  card.innerHTML = `${tiles()}<div class="eyebrow">${t("step")} ${step+1} ${t("of")} ${SECTIONS.length}</div><h2>${esc(L(s))}</h2><p class="lead">${esc(lang==="en"?s.ien:s.ies)}</p>
  <form id="form" novalidate><div class="qs">${s.qs.filter(visible).map(q=>`<div class="q" id="q_${q.id}">${field(q)}</div>`).join("")}</div>
  <div class="nav">${step>0?`<button type="button" class="btn" id="back">${t("back")}</button>`:`<span></span>`}<button type="submit" class="btn primary" id="next">${last?t("send"):t("next")}</button></div></form>`;
  const form=document.getElementById("form");
  s.qs.forEach(q=>{ if(q.max) applyMax(form,q); });
  form.addEventListener("change",e=>{
    const name=e.target.name||"";
    if(name==="f_website"||name==="f_foreign"){ const n=name.slice(2); collect(); renderStep(); document.getElementById(name+"_"+A[n])?.focus(); return; }
    s.qs.forEach(q=>{ if(q.max && name==="f_"+q.id) applyMax(form,q); });
  });
  const totals=()=>s.qs.filter(q=>q.type==="split"&&visible(q)).forEach(q=>{ const el=document.getElementById("f_"+q.id+"_total"); if(!el) return;
    const sum=[...form.querySelectorAll(`input[data-split="${q.id}"]`)].reduce((a,i)=>a+(Number(i.value)||0),0);
    el.textContent=sum?`${lang==="en"?"Total":"Total"}: ${sum}%`:""; el.classList.toggle("off",sum>0&&sum!==100); });
  totals();
  form.addEventListener("input",()=>{ totals(); clearTimeout(window._sv); window._sv=setTimeout(collect,400); });
  const back=document.getElementById("back"); if(back) back.onclick=()=>{ collect(); step--; save(); render(); };
  form.onsubmit=e=>{ e.preventDefault(); collect(); if(!validate()) return;
    if(step===0 && !startedSent) sendStarted();
    if(last) finish(); else { step++; save(); render(); card.scrollIntoView({block:"start"}); card.focus({preventScroll:true}); } };
}

/* ===== Scoring and estimate ===== */
function valuePer(){
  const n = k => { const v=Number(A[k]); return v>0?v:0; };
  if(isHosp(A)){ if(n("h_spendTable")) return {v:n("h_spendTable"),src:"spend per table"}; if(n("h_spendHead")) return {v:n("h_spendHead")*2.5,src:"spend per head x 2.5 covers"}; }
  if(isRE(A) && n("r_commission")) return {v:n("r_commission"),src:"commission per sale"};
  if(isRetail(A) && n("rt_order")) return {v:n("rt_order"),src:"average order"};
  if(isAppt(A) && n("a_spend")) return {v:n("a_spend"),src:"spend per visit"};
  return {v:DEFAULT_VALUE[A.sector]||80,src:"sector default (not given)",assumed:true};
}
function estimate(){
  const num = k => { const v=Number(A[k]); return v>0?v:0; };
  const vp = valuePer(), value = vp.v;
  const missed = num("missed")*value*conv()*ASSUME.weeks;
  const noshow = hasNoShows(A) ? num("noshows")*value*ASSUME.noshowRecover*ASSUME.weeks : 0;
  const hours = num("adminHours")*ASSUME.adminAutomatable*ASSUME.weeks;
  const admin = hours*ASSUME.hourly;
  const fees = num("cardMonthly")*12*ASSUME.feeSaving;
  const total = missed+noshow+admin+fees;
  return {value, valueSrc:vp.src, valueAssumed:!!vp.assumed, missed, noshow, admin, hours, fees, total, low: total*0.6, high: total*1.3};
}

function leadScore(e){
  let s=0;
  if(["owner","partner"].includes(A.role)) s+=2;
  s += {now:3,season:2,exploring:0}[A.timing]||0;
  s += {"<150":1,"150-400":2,"400-1000":3,"1000+":3,"depends":2,"skip":1}[A.budget]||0;
  s += e.total>30000?3:e.total>10000?2:e.total>3000?1:0;
  s += (A.top3||[]).length?1:0;
  if(["daily","sometimes"].includes(A.aiUse)) s+=1;
  if(A.sites==="2-3"||A.sites==="4+") s+=1;
  return {score:s, label: s>=9?"HOT":s>=5?"WARM":"COLD"};
}

function recommend(){
  const want = new Set(A.top3||[]), pts = {};
  const add = (k,n) => pts[k]=(pts[k]||0)+n;
  const missed=Number(A.missed||0);
  if(missed>=10 || want.has("afterhours")) add("receptionist",3+(missed>=22?2:0));
  if(want.has("replies") || ["day","later"].includes(A.replyTime)) add("whatsapp",3);
  if(want.has("bookings") || Number(A.noshows||0)>=6) add("noshow",3);
  if(isRE(A)){ add("leadscore", 2+(want.has("leads")?3:0)+(A.r_qualify==="dont"||A.r_qualify==="gut"?2:0)+(A.r_agents==="yes"?2:0));
    if(["week","more"].includes(A.r_listing)||want.has("translate")) add("listings",3); }
  if(want.has("leads") && !isRE(A)) add("return",3);
  if(isAppt(A) && A.a_return==="nothing") add("return",2);
  if(want.has("reviews")) add("reviews",3);
  if(want.has("content")) add("content",3);
  if(want.has("stock") || A.h_waste==="lots") add("stock",3);
  if(want.has("rota")) add("rota",3);
  if(want.has("admin") || Number(A.adminHours||0)>=15) add("admin",3);
  if(want.has("reports")||want.has("overview")) add("dashboard",3);
  if(["systems","reports","late"].includes(A.visibility)) add("dashboard",2+(A.visibility==="late"?2:0));
  if(want.has("alerts")) add("alerts",3);
  if(want.has("sales")) add("growth",4);
  { const sh=A.salesHow||[]; if(sh.some(x=>["outreach","calls","meetings","proposals"].includes(x))) add("growth",2); if(["months","long"].includes(A.saleTime)) add("growth",2); if(isRE(A)) add("growth",1); } if(A.visibility==="late") add("alerts",2);
  if(A.sites==="2-3") add("multisite",3); if(A.sites==="4+") add("multisite",5);
  let pa=0; if(["older","never","unsure"].includes(A.supplierCheck)) pa+=2; if(["no","monthly"].includes(A.payoutRecon)) pa+=2; if(A.feesKnown==="no") pa+=1; if(pa) add("payaudit",pa+1);
  if(want.has("website") || A.website==="none") add("website",3);
  if(want.has("translate") && !isRE(A)) add("whatsapp",1);
  const order=Object.entries(pts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  ["whatsapp","dashboard","admin"].forEach(k=>{ if(!order.includes(k)) order.push(k); });
  return order.slice(0,3);
}

/* ===== Payloads ===== */
function label(q,v){ if(q.type==="split"){ const m=Object.fromEntries(q.opts.map(o=>[o[0],o[1]])); return Object.entries(v).map(([k,x])=>`${m[k]}: ${x}%`).join(" · "); } if(!q.opts) return v; const m=Object.fromEntries(q.opts.map(o=>[o[0],o[1]])); return Array.isArray(v)?v.map(x=>m[x]||x).join(", "):(m[v]||v); }
function base(){ return {_captcha:"false",_template:"table",_honey:A._honey||"",_replyto:A.email||""}; }
function contactBlock(){ return {"Business":A.business,"Name":A.name,"Role":label(SECTIONS[0].qs[2],A.role),"Sector":label(SECTIONS[0].qs[3],A.sector),"Email":A.email,"Phone / WhatsApp":A.phone,"Source (ref)":REF||"direct","Answered in":lang==="en"?"English":"Spanish"}; }

async function post(payload){
  const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),15000);
  try{
    const r=await fetch(SUBMIT_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(payload),signal:ctrl.signal});
    const j=await r.json().catch(()=>({}));
    if(!r.ok || j.success===false || j.success==="false") throw new Error("rejected");
    return true;
  } finally { clearTimeout(tm); }
}

function sendStarted(){
  startedSent=true; save();
  const p=Object.assign(base(),{_subject:`[Adelante] Started: ${A.business} (${label(SECTIONS[0].qs[3],A.sector)})`},contactBlock(),
    {"Status":"Started the audit. If no full submission follows, this is a warm lead to call.","Started at":new Date().toLocaleString("en-GB",{timeZone:"Europe/Madrid"})});
  post(p).catch(()=>{ startedSent=false; save(); });
}

function fullPayload(e,ls,recs){
  const p=Object.assign(base(),{_subject:`[Adelante] ${ls.label} lead: ${A.business} · ${eur(e.low)} to ${eur(e.high)} a year at risk`},contactBlock());
  p["Lead score"]=`${ls.label} (${ls.score}/16)`;
  p["Estimated annual revenue at risk"]=`${eur(e.low)} to ${eur(e.high)} (midpoint ${eur(e.total)})`;
  p["Value per booking/sale used"]=`${eur(e.value)} (${e.valueSrc})`;
  p["Breakdown"]=`Missed enquiries ${eur(e.missed)} · No-shows ${eur(e.noshow)} · Admin ${eur(e.admin)} (${Math.round(e.hours)} hours) · Payment fees ${eur(e.fees)}`;
  p["Assumptions used"]=`Conversion ${Math.round(conv()*100)}% · no-shows preventable ${ASSUME.noshowRecover*100}% · admin €${ASSUME.hourly}/h, ${ASSUME.adminAutomatable*100}% automatable · ${ASSUME.weeks} weeks · fee saving ${(ASSUME.feeSaving*100).toFixed(1)}pp of card takings · revenue, not profit`;
  p["Suggested modules"]=recs.map(k=>MODULES[k].en[0]).join(" · ");
  SECTIONS.forEach((s,i)=>{ if(i===0) return; s.qs.forEach(q=>{
    if(!visible(q)) return; let v=A[q.id];
    if(v&&typeof v==="object"&&!Array.isArray(v)&&!Object.keys(v).length) v=undefined;
    if(!(v===undefined||v===""||(Array.isArray(v)&&!v.length))) p[`${s.en} · ${q.en}`]=q.type==="number"?eur(v):label(q,v);
    if(A[q.id+"_more"]) p[`${s.en} · ${q.en} (detail)`]=A[q.id+"_more"];
  }); });
  p["Consent"]=A.consent?"Yes":"No";
  p["Submitted"]=new Date().toLocaleString("en-GB",{timeZone:"Europe/Madrid"});
  return p;
}
const asText = p => Object.entries(p).filter(([k])=>!k.startsWith("_")).map(([k,v])=>`${k}\n${v}`).join("\n\n");

async function finish(){
  const btn=document.getElementById("next"); btn.disabled=true; btn.textContent=t("sending");
  const e=estimate(), ls=leadScore(e), recs=recommend();
  lastPayload=fullPayload(e,ls,recs);
  let ok=false; try{ ok=await post(lastPayload); }catch(err){ ok=false; }
  if(ok){ try{ localStorage.removeItem(KEY); }catch(x){} }
  step=SECTIONS.length; renderResults(e,recs,ok);
}

function renderResults(e,recs,ok){
  const a=t("resAssumeT").replace("{c}",Math.round(conv()*100)).replace("{n}",ASSUME.noshowRecover*100).replace("{h}",ASSUME.hourly).replace("{a}",ASSUME.adminAutomatable*100).replace("{w}",ASSUME.weeks);
  const wa=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`${t("waMsg")} ${A.business||""}.`)}`;
  const fail = ok?"":`<div class="result"><h3>${t("failH")}</h3><p class="lead">${t("failP")} <b style="user-select:all">${CONTACT_EMAIL}</b> · WhatsApp <b style="user-select:all">${WHATSAPP_SHOWN}</b></p>
    <div class="fallback"><textarea id="dump" readonly aria-label="Answers">${esc(lastPayload._subject+"\n\n"+asText(lastPayload))}</textarea>
    <div class="nav"><button class="btn" id="retry">${t("retry")}</button><button class="btn primary" id="copy">${t("copy")}</button></div></div></div>`;
  card.innerHTML = `${tiles(true)}<div class="eyebrow">${t("resEye")}</div><h2>${t("resH")}</h2>${fail}
  <div class="result"><div class="note">${t("resLeak")}</div><div class="big">${eur(e.low)} – ${eur(e.high)}</div><div class="note">${t("resRange")}</div>
    <div class="breakdown"><div><span>${t("resB1")}</span><span>${eur(e.missed)}</span></div>
    ${e.noshow?`<div><span>${t("resB2")}</span><span>${eur(e.noshow)}</span></div>`:""}
    <div><span>${t("resB3")}</span><span>${eur(e.admin)} · ${Math.round(e.hours)} ${t("resHours")}</span></div>
    ${e.fees?`<div><span>${t("resB4")}</span><span>${eur(e.fees)}</span></div>`:""}</div></div>
  <h3 style="margin-top:24px">${t("resMods")}</h3>
  <div class="mods">${recs.map(k=>`<div class="mod"><i aria-hidden="true"></i><div><b>${esc(MODULES[k][lang][0])}</b><p>${esc(MODULES[k][lang][1])}</p></div></div>`).join("")}</div>
  <details class="more" style="margin-top:20px"><summary>${t("resAssume")}</summary><p class="note">${esc(a)}</p></details>
  <p class="lead" style="margin-top:20px">${t("resNext")}</p>
  <div class="nav"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">${t("wa")}</a></div>`;
  card.scrollIntoView({block:"start"}); card.focus({preventScroll:true});
  if(!ok){
    document.getElementById("copy").onclick=async ev=>{ const ta=document.getElementById("dump"); try{ await navigator.clipboard.writeText(ta.value); ev.target.textContent=t("copied"); }catch(x){ ta.focus(); ta.select(); } };
    document.getElementById("retry").onclick=async ev=>{ ev.target.disabled=true; let r=false; try{ r=await post(lastPayload); }catch(x){} if(r){ try{localStorage.removeItem(KEY);}catch(y){} } renderResults(e,recs,r); };
  }
}

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.getElementById("foot").textContent=t("foot");
  if(step<0) renderIntro();
  else if(step>=SECTIONS.length){ const e=estimate(); renderResults(e,recommend(),true); }
  else renderStep();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ if(step>=0&&step<SECTIONS.length) collect(); lang=b.dataset.lang; save(); render(); });
render();
</script>
